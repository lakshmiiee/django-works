{% extends "home.html" %}

{% block extra %}

    <h1>Student List</h1>

<table border="2" cellpadding="10" cellspacing="2" align="center" width="50%" >
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Score</th>
        </tr>
    </thead>
    <tbody>
        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            
            <td>{{ student.score }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No students found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<br>

<p>
    <a href="{% url 'studentsform' %}" 
       style="background: #0e5261ff; 
              border: 1px solid black; 
              text-decoration: none; 
              border-radius: 5px; 
              padding: 8px 12px; 
              color: black;
              color: white;">
        Add New Student
    </a>
</p>


{% endblock %}
