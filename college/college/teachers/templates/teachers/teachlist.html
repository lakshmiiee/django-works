{% extends "home.html" %}

{% block extra %}

    <h1>Teachers List</h1>

<table border="2" cellpadding="10" cellspacing="2" align="center" width="50%" >
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
        </tr>
    </thead>
    <tbody>
        {% for teacher in teachers %}
        <tr>
            <td>{{ teacher.id }}</td>
            <td>{{ teacher.name }}</td>
            
            <td>{{ teacher.department }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No Teachers found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<br>

<p>
    <a href="{% url 'teachform' %}" 
       style="background: #0e5261ff; 
              border: 1px solid black; 
              text-decoration: none; 
              border-radius: 5px; 
              padding: 8px 12px; 
              color: black;
              color: white;">
        Add New Teacher
    </a>
</p>


{% endblock %}
