<!DOCTYPE html>
<html>
<head>
    <title>All Customers</title>
</head>
<body>

<p>{{ message }}</p>

<h2>Filtered Customers (email ends with @example.com)</h2>
<table border="1" cellpadding="5">
    <tr>
        <th>Name</th>
        <th>Email</th>
    </tr>
    {% for customer in filtered_customers %}
    <tr>
        <td>{{ customer.name }}</td>
        <td>{{ customer.email }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="2">No customers found.</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
