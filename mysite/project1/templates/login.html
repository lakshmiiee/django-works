<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 450px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form p {
            margin-bottom: 12px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            margin-top: 4px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
        }

        input[type="submit"]:hover {
            background: #004d99;
        }

        .errorlist {
            color: red;
            margin: 5px 0 0 0;
            list-style: none;
            padding: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LOGIN FORM</h1>

    <form action="" method="POST">
        {{ form.non_field_errors }}
        {% csrf_token %}<br>
        <label>Email</label><br>
        <input type="email" name="email"><br><br>
        {{form.email.errors}}<br>
        <label>Password</label><br>
        <input type="password" name="password"><br><br>
        {{form.password.errors}}<br>
        <input type="submit" value="Submit">
    </form>
</div>

</body>
</html>
